[project]
name = "harbor-voice"
version = "0.1.0"
description = "A local-first, approval-gated Windows voice assistant."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper",
  "numpy>=1.26",
  "openai-codex",
  "platformdirs>=4",
  "pydantic>=2.12",
  "pynput>=1.8",
  "PySide6>=6.8",
  "pyttsx3>=2.98",
  "qasync>=0.27",
  "sounddevice>=0.5",
]

[project.scripts]
harbor-voice = "harbor_voice.app:main"
harbor-voice-doctor = "harbor_voice.diagnostics:main"

[dependency-groups]
dev = [
  "pyinstaller>=6",
  "pytest>=8",
  "pytest-asyncio>=1",
  "pytest-qt>=4",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
